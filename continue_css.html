<html>

<head>
    <style>
        a:link {
            color: red;
        }

        a:visited {
            color: green;
        }

        a:hover {
            color: blue;
            background-color: brown;
            font-size: 50px;
        }

        a:active {
            color: yellow;
        }

        /*This is how you can use margin and padding*/
        div {
            background: aqua;
            color: red;
            height: 40px;
            padding: 12px;
            margin: 12px;
            border: 5px solid yellow;

        }
    </style>
</head>

<body>
    <a href="https://www.google.com">Google</a>
    <div>This is the contiue notes of the css</div>
</body>

</html>
