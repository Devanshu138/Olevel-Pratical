<html>

<head>
    <style>
        a:link {
            color: red;
        }

        a:visited {
            color: green;
        }

        a:hover {
            color: blue;
            background-color: brown;
            font-size: 50px;
        }

        a:active {
            color: yellow;
        }

        /*This is how you can use margin and padding*/
        div {
            background: aqua;
            color: red;
            height: 40px;
            padding: 12px;
            margin: 12px;
            border: 5px solid yellow;
            word-spacing: 3px;
            letter-spacing: 2px;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            text-shadow: 2px 2px 2px red;
            text-indent: 2px;
            text-overflow: ellipsis;
            text-wrap: wrap;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            text-shadow: 2px 2px 2px red;
            text-indent: 2px;
            text-overflow: ellipsis;
            text-wrap: wrap;

        }
    </style>
</head>

<body>
    <a href="https://www.google.com">Google</a>
    <div>This is the contiue notes of the css</div>
</body>

</html>
