<html>

<head>
    <style>
        a:link {
            color: red;
        }

        a:visited {
            color: green;
        }

        a:hover {
            color: blue;
            background-color: brown;
            font-size: 50px;
        }

        a:active {
            color: yellow;
        }

        b {
            vertical-align: super;
        }

        #d1 {
            border: 5px solid red;
            /* You can also use position: absolute, fixed, sticky, relative */
            position: relative;
            top: 20px;
            left: 50px;
            right: 50px;
            bottom: 50px;

        }

        /* Image Gallery Definitions */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .gallery-item {
            border: 2px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            border-color: blue;
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .gallery-desc {
            padding: 15px;
            text-align: center;
            background: #f4f4f4;
            font-weight: bold;
        }


        /*This is how you can use margin and padding*/
        .demo-div {
            background: aqua;
            color: red;
            height: 40px;
            padding: 12px;
            margin: 12px;
            /* you can also use nowrap , pre-wrap , pre-line , pre , normal */
            white-space: pre;
            border: 5px solid yellow;
            word-spacing: 3px;
            letter-spacing: 2px;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            text-shadow: 2px 2px 2px red;
            text-indent: 2px;
            text-overflow: ellipsis;
            text-wrap: wrap;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            text-shadow: 2px 2px 2px red;
            text-indent: 2px;
            text-overflow: ellipsis;
            text-wrap: wrap;

        }
    </style>
</head>

<body>
    <a href="https://www.google.com">Google</a>
    <div class="demo-div">This i s the <b>contiue</b> not s of th e css</div>
    <img src="Study.jpg" id="d1" height="300">
    <p>This is contiue notes of the css of the file name css.html in by reading this
        files you can learn revise css in one shot .
    </p>
    <div class="gallery">
        <div class="gallery-item">
            <img src="Study.jpg" alt="Nature">
            <div class="gallery-desc">Nature View</div>
        </div>
        <div class="gallery-item">
            <img src="Motivational.jpg" alt="Architecture">
            <div class="gallery-desc">Modern Architecture</div>
        </div>
        <div class="gallery-item">
            <img src="theunsuccessfulcoder.png" alt="Technology">
            <div class="gallery-desc">Future Tech</div>
        </div>
    </div>


</body>

</html>
